# slim.cfg — test fixture: format = slim with a few [exclude] rules (log everything else).

[settings]
subsystem = com.apple.eslogger
category = events
format = slim
parent_cmdline_max = 256
record_max = 32000

[include]

[exclude]
Image begin with /opt/observiq-otel-collector/
ParentImage begin with /opt/observiq-otel-collector/
# Chrome helpers: excluded by the launched binary's Team ID (children Chrome spawns stay logged)
TeamId is EQHXZ8M8AV
