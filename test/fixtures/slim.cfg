# ESDaemon.cfg — what ESDaemon lets through to the unified log.
# Edit, then apply:  sudo /usr/local/ESDaemon/reload.sh
# Lines starting with # are comments. One value per line inside a [section].

[settings]
# eslogger event types to subscribe (space separated). Changing this restarts eslogger.
events = exec
# where kept events are written (eslogger's own default -> Bindplane predicate unchanged)
subsystem = com.apple.eslogger
category = events
# output format written to the unified log:
#   sysmon        = Sysmon field names only (exec -> EventID 1, create/rename -> 11, unlink -> 23)
#   sysmon+extras = Sysmon fields + macOS extras: SigningId, TeamId, IsPlatformBinary (and Parent*),
#                   OriginalParentProcessId, ResponsibleProcessId, Uid, Tty, Script
#   slim   = compact eslogger JSON (stat blocks and most env vars removed, ~60% smaller)
#   raw    = eslogger JSON untouched (filtered only)
format = slim
# third-party (non-Apple-platform) executables:
#   all        = keep every third-party / unsigned / ad-hoc exec (default; Chrome/Teams/Zoom helpers add volume)
#   drop_noisy = same, but drop binaries signed by the Team IDs in [noisy_team_ids]
third_party = drop_noisy

