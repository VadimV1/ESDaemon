# ESDaemon.cfg — ESDaemon logs everything [modules] lists; [include] / [exclude] narrow that down.
# Edit, then apply:  sudo /usr/local/ESDaemon/reload.sh
# Lines starting with # are comments. One value per line inside a [section].

[settings]
# where events are written (eslogger's own default -> Bindplane predicate unchanged)
subsystem = com.apple.eslogger
category = events
# output format written to the unified log:
#   sysmon        = Sysmon field names only (ProcessStart = EventID 1, FileCreate = 11, FileDelete = 23 ...)
#   sysmon+extras = Sysmon fields + macOS extras: SigningId, TeamId, IsPlatformBinary,
#                   ResponsibleProcessId, Tty, Script, OriginalParentProcessId (only if != ParentProcessId),
#                   GlobalSeqNum (EndpointSecurity's number for the event, docs/CONFIG.md#event-numbers)
#   slim   = compact eslogger JSON (stat blocks and most env vars removed, ~60% smaller)
#   raw    = eslogger JSON untouched (filtered only)
format = sysmon+extras
# ParentCommandLine is repeated in every child event; cap it (characters, 0 = no cap). CommandLine is only cut by record_max,
# and [include]/[exclude] rules match the full parent command line.
parent_cmdline_max = 256
# largest number of argv elements rendered into CommandLine (0 = no cap). argv is attacker-controlled and can hold
# hundreds of thousands of entries; rendering them all stalls the single-threaded filter and makes macOS drop events.
# Beyond this count the command line is cut with a …[+N args] marker. Normal commands have far fewer.
args_max = 4096
# largest record written (bytes, 0 = no limit). The unified log cuts messages above 32759 bytes into invalid JSON;
# a bigger record has its largest value (usually CommandLine) cut in the middle, marked …[+N chars]…
record_max = 32000
# liveness: every this many seconds ESDaemon logs an eslogger_scoped_heartbeat record (0 = off, at most 86400).
# A Mac that sends none for two intervals has a stopped pipeline, not a quiet day (docs/CONFIG.md#heartbeat).
heartbeat = 300


# ---- What to log ----
# One line per object: <object> = <operation>[, <operation> ...]. Changing this restarts eslogger.
# Nothing listed = process = start.
#   process = start        a program launched
#             exit         a program ended
#             inject       one process taking control of another (task port, remote thread, debugger attach)
#   file    = read         a file opened for reading only
#             write        a file that was changed (one record when it is closed, not per write call)
#             create       a new file
#             delete       a file removed
#             rename       a file moved or renamed
#             attributes   permissions, owner, flags, ACL or extended attributes changed (e.g. quarantine removed)
#   user    = login        console, SSH, screen sharing and unlock, plus authentication attempts
#             logout       logout, SSH logout, screen lock, screen sharing ended
#             sudo         sudo and su
#             account      user or group created, deleted or changed, password changed
#   system  = persistence  launch agent / daemon or login item added or removed
#             malware      XProtect detection or remediation
#             kernel       kernel extension loaded or unloaded
#             mount        disk or share mounted, unmounted, remounted
# Records are named <Object><Operation> in EventType (ProcessStart, FileRead, UserLogin ...), so [include] and
# [exclude] can pick them, e.g.  EventType is FileRead AND TargetFilename begin with /Users/
# File read/write events are very frequent: pair them with [include] / [exclude] rules.
[modules]
# Supported feeds for now: process (exec) and user (login) — what logged in and what ran. These are the
# eslogger feeds ESDaemon has developed and validated end to end.
# The file and system modules are recognised by this config DSL (documented above) but their feeds are NOT
# developed yet — treat them as experimental and unsupported for now; enabling them is at your own risk.
process = start
user = login

# ---- Filtering (Sysmon semantics) ----
# Every event is logged by default. Rules narrow that down:
#   [include]  empty (default) = include every event; with rules = log ONLY events matching one of them
#   [exclude]  events matching any rule are never logged, even when [include] matched (exclude wins)
# One rule per line, same words as a Sysmon config:
#   <Field> <condition> <value>  [AND <Field> <condition> <value> ...]
# Fields:     EventType  Image  CommandLine  CurrentDirectory  ParentImage  ParentCommandLine  User
#             TeamId  SigningId  IsPlatformBinary  TargetFilename (file events)
#             EventType = ProcessStart | ProcessExit | FileRead | FileWrite | FileCreate | ... (see [modules])
# Conditions: is | is not | is any | contains | contains any | contains all | excludes | excludes any | excludes all
#             begin with | not begin with | begin with any | end with | not end with | end with any | image | regex | not regex
# All clauses on a line must match (AND). Separate lines are alternatives (OR). Every condition has a negated form,
# so any combination can be written, e.g. "exclude Apple-signed tools except curl":
#   SigningId begin with com.apple. AND Image not end with /curl
# Case-insensitive, like Sysmon. "any"/"all" conditions take ;-separated values. Quote a value ("...") if it
# contains the word AND. A clause on a field the event does not have never matches.
# Command lines are attacker-controlled: never exclude on CommandLine alone; pin Image / ParentImage / TeamId too.
# ESDaemon never logs its own processes (built in, not a rule here).

[include]
# Examples (uncomment to log only these):
#   EventType is ProcessStart
#   EventType is FileCreate AND TargetFilename contains any /LaunchAgents/;/LaunchDaemons/
#   IsPlatformBinary is false

[exclude]
# The default excludes drop only collector self-noise and Apple's own housekeeping. Each rule pins an exact binary
# (and, for file events, that binary's own folder), so the same paths written by anything else stay logged.
# Measured on an idle macOS 26 Mac: ~95 -> ~13 records per 10 minutes (docs/DEFAULT-CONFIG.md).

# -- Collector and ESDaemon tooling
# Bindplane agent: its own processes, the `log show` it runs every poll, and the files those write
Image begin with /opt/observiq-otel-collector/
ParentImage begin with /opt/observiq-otel-collector/
# eslogger itself (e.g. `eslogger --list-events` run by reload.sh). Full path only: a copy elsewhere stays logged.
# Note this also hides someone running /usr/bin/eslogger by hand.
Image is /usr/bin/eslogger

# -- Apple process starts with no investigative value
# launchd's start-up step for Apple services: the program it starts is logged as its own record (same pid), so only
# the launchd job name is lost. Apple names AND started by launchd (parent pid 1 from the start): anyone can give
# xpcproxy these arguments, so one run from a shell, an app or a script stays logged, as does every other service's.
# A job anyone defines with a com.apple. label (a LaunchAgent, launchctl submit) is started the same way: its xpcproxy
# step is dropped too, and the program it runs is treated like anything else launchd starts.
Image is /usr/libexec/xpcproxy AND ParentImage is /sbin/launchd AND CommandLine begin with "xpcproxy com.apple."
Image is /usr/libexec/xpcproxy AND ParentImage is /sbin/launchd AND CommandLine begin with "xpcproxy application.com.apple."
# Spotlight's indexing workers (path AND signing ID, so a copy elsewhere stays logged)
Image is /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/Metadata.framework/Versions/A/Support/mdworker_shared AND SigningId is com.apple.mdworker_shared
# contacts daemon starting under each Apple service account
Image is /System/Library/Frameworks/Contacts.framework/Support/contactsd AND EventType is ProcessStart AND IsPlatformBinary is true

# -- Apple daemons writing their own internal files
# temp copies while saving their own files (write in TemporaryItems, then swap into place)
Image is any /usr/libexec/mobileassetd;/usr/sbin/cfprefsd;/usr/libexec/duetexpertd;/usr/libexec/dasd;/System/Library/PrivateFrameworks/ChronoCore.framework/Support/chronod;/System/Library/PrivateFrameworks/IDS.framework/identityservicesd.app/Contents/MacOS/identityservicesd;/usr/libexec/locationd AND TargetFilename contains /TemporaryItems/ AND IsPlatformBinary is true
# Siri suggestions engine rebuilding its model cache
Image is /usr/libexec/duetexpertd AND TargetFilename contains /Library/Caches/com.apple.duetexpertd/
# Spotlight's index store
Image is any /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/Metadata.framework/Versions/A/Support/mds;/System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/Metadata.framework/Versions/A/Support/mds_stores AND TargetFilename contains /.Spotlight-V100/
# Biome (Apple's on-device activity store) temp files
Image is /System/Library/PrivateFrameworks/BiomeStreams.framework/Support/BiomeAgent AND TargetFilename contains /Library/Biome/tmp/

# -- macOS's own daemons (structural): Apple-signed, in the system folders macOS protects from change, AND started by
#    launchd (parent pid 1 from the start). The same Apple tools run from a shell, an app or a script have another
#    parent and stay logged. Whoever writes them, these stay logged: LaunchAgents/LaunchDaemons, /Applications,
#    configuration profiles, Gatekeeper/XProtect (except the boot rewrite below), TCC, keychains, security-relevant
#    preferences, network configuration, mount points, and background downloads (nsurlsessiond).
# their process starts (xpcproxy excepted: third-party services' launches stay visible)
EventType is ProcessStart AND IsPlatformBinary is true AND ParentImage is /sbin/launchd AND Image begin with any /System/Library/;/usr/libexec/;/usr/sbin/;/System/Volumes/Preboot/Cryptexes/;/System/iOSSupport/;/Library/Apple/System/Library/ AND Image is not /usr/libexec/xpcproxy
# Apple app extensions and widgets started by launchd (the apps themselves, e.g. Terminal, stay logged)
EventType is ProcessStart AND IsPlatformBinary is true AND ParentImage is /sbin/launchd AND Image begin with /System/Applications/ AND Image contains any .appex/;/Contents/Resources/systemsettingsagent
# Apple framework helpers started by an Apple framework daemon (disk checks at boot, smart-card and login helpers).
# Shells and scripts an Apple daemon starts (e.g. package install scripts) are not in these folders and stay logged.
EventType is ProcessStart AND IsPlatformBinary is true AND Image begin with any /System/Library/;/usr/libexec/ AND ParentImage begin with any /System/Library/;/usr/libexec/
# their own files in system private areas: temp, runtime, caches, Spotlight, logs, Apple's asset and update volumes, daemon databases
EventType is any FileCreate;FileDelete AND IsPlatformBinary is true AND ParentImage is /sbin/launchd AND Image begin with any /System/Library/;/usr/libexec/;/usr/sbin/;/System/Volumes/Preboot/Cryptexes/ AND Image is not /usr/libexec/nsurlsessiond AND TargetFilename begin with any /private/var/folders/;/private/var/run/;/private/var/protected/;/Library/Caches/;/System/Library/Caches/;/private/var/root/Library/Caches/;/private/var/log/asl/;/System/Library/AssetsV2/;/System/Volumes/Update/;/System/Volumes/Data/.Spotlight-V100/;/System/Volumes/Data/.fseventsd/;/private/var/db/Spotlight-V100/;/private/var/db/Spotlight/;/private/var/db/CVMS/;/private/var/db/assetsubscriptiond/;/private/var/db/eligibilityd/;/private/var/db/os_eligibility/;/private/var/db/locationd/;/private/var/db/biome/;/private/var/db/timed/;/private/var/db/accessoryupdater/;/private/var/db/systemstats/;/private/var/db/diagnostics/;/private/var/db/analyticsd/;/private/var/db/com.apple.modelcatalog/;/private/var/db/mds/;/private/var/db/softwareupdate/
# their own files in a user's Library, except the places persistence and secrets live
EventType is any FileCreate;FileDelete AND IsPlatformBinary is true AND ParentImage is /sbin/launchd AND Image begin with any /System/Library/;/usr/libexec/;/usr/sbin/;/System/Volumes/Preboot/Cryptexes/ AND TargetFilename begin with /Users/ AND TargetFilename contains any /Library/;/Pictures/Photos Library.photoslibrary/private/ AND TargetFilename excludes all /Library/LaunchAgents/;/Library/Preferences/;/Library/Keychains/;/Library/Application Support/com.apple.TCC/;/Library/Application Support/com.apple.backgroundtaskmanagementagent/;/Library/Services/;/Library/ScriptingAdditions/;/Library/Input Methods/;/Library/Application Scripts/
# their safe-save temp copies (name.sb-xxxxxxxx-XXXXXX, renamed over the real file at once), e.g. of keychain databases
EventType is any FileCreate;FileDelete AND IsPlatformBinary is true AND ParentImage is /sbin/launchd AND Image begin with any /System/Library/;/usr/libexec/;/usr/sbin/ AND TargetFilename regex \.sb-[0-9a-f]{8}-[A-Za-z0-9]{6}$
# preference saves, except domains that control persistence or security (login hooks/items, LaunchServices, firewall,
# security, Gatekeeper, Dock, Terminal, background tasks)
EventType is any FileCreate;FileDelete AND Image is /usr/sbin/cfprefsd AND IsPlatformBinary is true AND TargetFilename contains /Library/Preferences/ AND TargetFilename excludes all loginwindow;loginitems;LaunchServices;com.apple.alf;com.apple.security;SystemPolicy;com.apple.dock;com.apple.Terminal;backgroundtaskmanagement
# Apple's software-update helpers running from the protected update volume, and the disk tools they start
EventType is any ProcessStart;FileCreate;FileDelete AND IsPlatformBinary is true AND Image begin with /System/Volumes/Update/MobileAsset/AssetsV2/com_apple_MobileAsset_MobileSoftwareUpdate_
EventType is ProcessStart AND IsPlatformBinary is true AND ParentImage begin with /System/Volumes/Update/MobileAsset/AssetsV2/com_apple_MobileAsset_MobileSoftwareUpdate_ AND Image begin with /System/Library/Filesystems/

# -- Apple stores rewritten by their own daemon at every boot (the same files each time). Pinned to that daemon AND its
#    store: any other process changing these files stays logged.
EventType is any FileCreate;FileDelete AND Image is any /usr/libexec/kernelmanager_helper;/usr/libexec/kernelmanagerd AND IsPlatformBinary is true AND TargetFilename begin with /private/var/db/KernelExtensionManagement/
EventType is any FileCreate;FileDelete AND Image is /usr/libexec/syspolicyd AND IsPlatformBinary is true AND TargetFilename begin with /private/var/db/SystemPolicyConfiguration/
EventType is any FileCreate;FileDelete AND Image is /usr/libexec/usermanagerd AND IsPlatformBinary is true AND TargetFilename begin with /private/var/db/keybags/ AND TargetFilename end with .writing
EventType is any FileCreate;FileDelete AND Image is any /System/Library/CoreServices/ManagedClient.app/Contents/MacOS/ManagedClient;/usr/libexec/mdmclient AND IsPlatformBinary is true AND TargetFilename end with /.createStore.lock
EventType is any FileCreate;FileDelete AND Image is /usr/sbin/systemstats AND IsPlatformBinary is true AND TargetFilename begin with /private/var/db/systemstats/
EventType is any FileCreate;FileDelete AND Image is /sbin/launchd AND IsPlatformBinary is true AND TargetFilename begin with /private/var/run/

# -- Your own excludes go here. Examples:
#   TeamId is any UBF8T346G9;EQHXZ8M8AV
#   Image is /usr/local/bin/jamf AND CommandLine is "/usr/local/bin/jamf policy -event recurring"
#   ParentImage is /usr/local/bin/jamf AND Image image sh AND CommandLine contains "jamf inventory"
#   Image image python3 AND CommandLine regex ^python3 /opt/corp/[a-z]+\.py$
