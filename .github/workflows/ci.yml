name: ci
# Pull requests to main, and main itself. A PR branch's own pushes don't trigger it, so each commit of a pull
# request runs once (as pull_request), not twice (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to a commit SHA (the comment names its release): a tag can be moved to other code.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not -latest: a new image (shellcheck, jq) comes in by a deliberate bump, never on its own
        # macos-15: the oldest macOS ESDaemon supports; macos-26: the newest GitHub offers
        os: [ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # filter.sh and install.sh run /usr/bin/jq; the tests call plain jq, which on the runner is Homebrew's.
      # /usr/bin first makes it Apple's, and resolves every other tool the way the launchd jobs do.
      - name: use Apple's jq
        if: runner.os == 'macOS'
        run: echo /usr/bin >> "$GITHUB_PATH"
      - name: jq
        run: |
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          command -v jq; jq --version
          [ "$RUNNER_OS" != macOS ] || [ "$(command -v jq)" = /usr/bin/jq ] || { echo "::error::tests would not run against /usr/bin/jq"; exit 1; }
      - id: lint
        run: make lint
      - if: success() || steps.lint.outcome == 'failure'   # a lint failure must not hide the test results
        run: make test

  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the oldest supported macOS on Intel, where the release's x86_64 slice runs
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build
      # Run as filter.sh runs it, found with the predicate collectors use. 5000 bytes: past the ~1 KB a message is
      # cut to unless large messages are on for its subsystem and category (see reload.sh).
      - name: binary writes to the unified log
        run: |
          pred='subsystem == "com.apple.eslogger" AND category == "events" AND process == "ESDaemon"'
          rec="$(printf '{"esdaemon_ci":"%s","pad":"%05000d"}' "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" 0)"
          printf '%s\n' "$rec" | build/ESDaemon com.apple.eslogger events
          for _ in $(seq 30); do
            log show --last 5m --style ndjson --predicate "$pred" > "$RUNNER_TEMP/log.ndjson" || true
            if jq -e -R --arg r "$rec" 'fromjson? | select(.eventMessage? == $r)' "$RUNNER_TEMP/log.ndjson" >/dev/null; then
              echo "record landed intact (${#rec} bytes)"; exit 0
            fi
            sleep 2
          done
          echo "::error::no intact ${#rec}-byte record in the unified log; the last lines the predicate matched:"
          tail -3 "$RUNNER_TEMP/log.ndjson" | cut -c1-300; exit 1
      # The heartbeat, as filter.sh asks for it ([settings] heartbeat and format): a record of the writer's own every
      # interval, the first one interval after start, counting the records logged since the previous one. Two writers,
      # a sysmon and a slim one, told apart by process ID; both must still end at the end of their input.
      - name: binary writes heartbeats
        run: |
          pred='subsystem == "com.apple.eslogger" AND category == "events" AND process == "ESDaemon"'
          { printf '{"esdaemon_ci":%d}\n' 1 2 3; sleep 7; } | build/ESDaemon com.apple.eslogger events 2 sysmon+extras & s=$!
          sleep 7 | build/ESDaemon com.apple.eslogger events 2 slim & r=$!
          ( sleep 60; kill "$s" "$r" ) >/dev/null 2>&1 & dog=$!
          wait "$s" && wait "$r" || { echo "::error::a writer with a heartbeat did not end at the end of its input"; exit 1; }
          kill "$dog" 2>/dev/null || true
          logged='fromjson? | objects | select(.processID == $s or .processID == $r) | .eventMessage'
          for _ in $(seq 30); do
            log show --last 5m --style ndjson --predicate "$pred" > "$RUNNER_TEMP/hb.ndjson" || true
            if jq -e -n -R --argjson s "$s" --argjson r "$r" '
                [inputs | fromjson? | objects | {p: .processID, m: (.eventMessage | fromjson? // {})}] as $all
                | [$all[] | select(.p == $s) | .m | objects | select(has("eslogger_scoped_heartbeat"))] as $a
                | [$all[] | select(.p == $r) | .m | objects | select(has("eslogger_scoped_heartbeat"))] as $b
                | ($a | length) >= 2 and ($b | length) >= 2
                  and ($a[0] | keys_unsorted) == ["EventID","EventType","UtcTime","eslogger_scoped_heartbeat","time","records"]
                  and $a[0].EventID == 100 and $a[0].EventType == "eslogger_scoped_heartbeat" and $a[0].eslogger_scoped_heartbeat == 2
                  and ($a[0].time | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                  and $a[0].UtcTime == ($a[0].time | sub("T"; " ") | sub("Z"; ".000"))
                  and [$a[].records] == [3] + [range(1; $a | length) | 0]
                  and ($b[0] | keys_unsorted) == ["eslogger_scoped_heartbeat","time","records"]
                  and [$b[].records | select(. != 0)] == []' "$RUNNER_TEMP/hb.ndjson" >/dev/null; then
              echo "heartbeats landed:"; jq -c -R --argjson s "$s" --argjson r "$r" "$logged" "$RUNNER_TEMP/hb.ndjson"; exit 0
            fi
            sleep 2
          done
          echo "::error::no heartbeats of the expected shape in the unified log; what the two writers logged:"
          jq -c -R --argjson s "$s" --argjson r "$r" "$logged" "$RUNNER_TEMP/hb.ndjson" | tail -12; exit 1
